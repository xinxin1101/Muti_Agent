[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devflow-backend"
version = "0.1.0"
description = "Evidence-driven multi-agent software engineering runtime backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2",
    "dramatiq[redis]>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=1.60,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
devflow = "app.cli:main"
devflow-api = "app.api.main:run"
devflow-benchmark = "app.benchmark.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
