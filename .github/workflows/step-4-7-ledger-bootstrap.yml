name: Step 4.7 Ledger Bootstrap

on:
  push:
    branches:
      - agent/phase-4-step-4-7-github-publication
    paths:
      - ".github/workflows/step-4-7-ledger-bootstrap.yml"

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-4-step-4-7-github-publication

      - name: Freeze Step 4.7 acceptance and advance progress
        run: |
          python - <<'PY'
          from pathlib import Path

          implementation_head = "2cb2544c06c6a5f48e29ac4f6ccb91678de53c37"

          acceptance = f'''# Step 4.7 Acceptance — GitHub Branch + Draft PR Integration

          Status: **ACCEPTED / COMPLETE**

          Step 4.7 is accepted with the following frozen guarantees and boundaries:

          - only an already-SUCCEEDED persisted Run is publication-eligible;
          - multi-task publication requires complete accepted integration evidence covering every persisted task;
          - single-task fallback uses only unique accepted successful worker commit evidence whose base equals the persisted Run base;
          - source commits and accepted parent chains are revalidated from the managed local Git repository before publication;
          - browser requests cannot supply commit SHA, ref, branch, local path, base/head SHA, PR title/body, or credentials;
          - the remote branch is deterministically restricted to `devflow/run-<run_id>`;
          - an existing exact branch is idempotent while the same branch at a different SHA fails closed;
          - publication never force-pushes, deletes refs, or writes the default branch;
          - GitHub credentials stay backend-only and never appear in command arguments, browser DTOs, generic evidence, runtime events, persisted audit intent/claim data, or bounded external errors;
          - REST credentials are pinned to `https://api.github.com`, with explicit API version `2026-03-10` and typed validation of returned PR identity;
          - only an exact open Draft PR matching repository/head SHA/head branch/base branch and exact PR URL/number identity is accepted;
          - GitHub duplicate behavior is not treated as the concurrency lock: one PostgreSQL PUBLISHING claim with backend-only attempt token and DB-time expiry fences concurrent publication attempts;
          - a second live attempt fails closed; an expired attempt may be taken over with a new token; the stale token cannot persist FAILED or PUBLISHED afterward;
          - configured production Git/GitHub operation timeout remains bounded within the publication claim window;
          - retries cannot create uncontrolled duplicate branches or Pull Requests;
          - terminal typed evidence remains append-closed; publication results use the separate non-authoritative `github_publications` audit projection;
          - publication intent is immutable/hash-validated and audit corruption fails closed;
          - an already-PUBLISHED audit row cannot be downgraded by a late failure;
          - GitHub failure never rewrites accepted local Git/runtime truth or Run status;
          - `GET /api/v1/runs/{{run_id}}/github-publication` is selector-free;
          - `POST /api/v1/runs/{{run_id}}/github-publication` accepts no query selectors and no request body;
          - React exposes only backend-selected publication facts plus a no-body Draft PR action for eligible Runs;
          - React treats PUBLISHING as a read-only projection: retries ask the backend to decide live-claim conflict versus DB-time takeover, and no claim token is exposed;
          - publication success updates only publication state and never derives or mutates Run success;
          - Step 4.8 benchmark/demo behavior remains deferred.

          ## Final exact-head implementation acceptance

          Accepted implementation head before ledger advancement:

          `{implementation_head}`

          Backend Quality on that exact head:

          - PostgreSQL + Redis service startup: **PASS**;
          - Alembic `0001 → 0002 → 0003 → 0004 → 0005 → 0006 → downgrade base → upgrade through 0006`: **PASS**;
          - verification Docker image build: **PASS**;
          - `ruff check .`: **PASS**;
          - persisted SUCCEEDED eligibility and single-task Run-base provenance regressions: **PASS**;
          - real two-task integration-source / exact Git parent-chain regressions: **PASS**;
          - non-force/default-branch/ref-deletion Git publication regressions: **PASS**;
          - branch same-SHA idempotence / different-SHA conflict regressions: **PASS**;
          - PostgreSQL PUBLISHING claim, takeover, stale-token fencing, and PUBLISHED non-downgrade regressions: **PASS**;
          - selector/body-free API regressions: **PASS**;
          - GitHub REST version/header/open-Draft/head/base/URL identity regressions: **PASS**;
          - GitHub API credential-destination pinning regression: **PASS**;
          - complete backend `pytest`: **332 passed in 32.79s** with no pytest warning summary.

          Frontend Quality on the same exact head:

          - locked `npm ci`: **PASS**;
          - strict TypeScript typecheck: **PASS**;
          - lint: **0 warnings / 0 errors**;
          - Vitest: **25 passed across 6 test files**;
          - non-SUCCEEDED Runs expose no publication query/action: **PASS**;
          - backend-selected publication facts only / no browser SHA-ref-token form: **PASS**;
          - PUBLISHING stale-claim recovery remains backend-owned: **PASS**;
          - publication success does not mutate Run status/query authority: **PASS**;
          - Vite production build: **PASS**.

          Step 4.7 CI does not perform a live external GitHub mutation: GitHub REST behavior is exercised through typed mock transports and Git command boundaries through deterministic/fake or temporary local repositories. No paid SiliconFlow API call is required.

          Merge review confirmed no unresolved review threads and no path from GitHub branch/PR/check state to Run success, verification, Reviewer approval, integration authorization, Human Gate, lease ownership, or `run_token` authority.

          Both `docs/GITHUB_PUBLICATION.md`, this acceptance document, and `docs/PROGRESS.md` are covered by Backend Quality and Frontend Quality path gates. The final acceptance/progress ledger head must therefore pass both workflows again after temporary bootstrap cleanup and before merge.

          Frozen Step 4.7 principle:

          > **Accepted runtime/Git evidence selects what may be published; GitHub only receives that already-accepted projection.**
          '''
          acceptance = "\n".join(line[10:] if line.startswith("          ") else line for line in acceptance.splitlines()) + "\n"
          Path("docs/STEP_4_7_ACCEPTANCE.md").write_text(acceptance, encoding="utf-8")

          progress_path = Path("docs/PROGRESS.md")
          progress = progress_path.read_text(encoding="utf-8")
          replacements = {
              "- Completed item: **Step 4.6 — Run metrics**": "- Completed item: **Step 4.7 — GitHub branch + Draft PR integration**",
              "- Next item: **Step 4.7 — GitHub branch + Draft PR integration**": "- Next item: **Step 4.8 — Benchmark/demo suite**",
              "- Step 4.7 status: **NOT STARTED**": "- Step 4.7 status: **ACCEPTED / COMPLETE**\n- Step 4.8 status: **NOT STARTED**",
              "| 4.7 | GitHub branch + Draft PR integration | **NEXT / NOT STARTED** | — |": "| 4.7 | GitHub branch + Draft PR integration | **ACCEPTED** | evidence-bound source + fenced DevFlow branch/open Draft PR; Backend Quality: 332 passed; Frontend Quality: 25 tests + typecheck + lint + build |",
              "| 4.8 | Benchmark/demo suite | **NOT STARTED** | — |": "| 4.8 | Benchmark/demo suite | **NEXT / NOT STARTED** | — |",
          }
          for old, new in replacements.items():
              if old not in progress:
                  raise SystemExit(f"missing expected PROGRESS marker: {old}")
              progress = progress.replace(old, new, 1)

          gate = progress.find("## Gate before Step 4.7 — GitHub Branch + Draft PR Integration")
          if gate < 0:
              raise SystemExit("missing Step 4.7 gate marker")
          accepted_tail = f'''## Step 4.7 — GitHub Branch + Draft PR Integration — ACCEPTED

          Accepted through PR #32 candidate: `Phase 4 Step 4.7: add evidence-bound GitHub publication`.

          Design / acceptance documents:

          - `docs/GITHUB_PUBLICATION.md`
          - `docs/STEP_4_7_ACCEPTANCE.md`

          ### Accepted publication authority chain

          ```text
          accepted typed Run / Git evidence
                  ↓
          backend publication eligibility
                  ↓
          local Git provenance revalidation
                  ↓
          immutable GitHubPublicationIntent
                  ↓
          PostgreSQL PUBLISHING claim + fencing token
                  ↓
          devflow/run-<run_id>
                  ↓
          bounded non-force GitHub push
                  ↓
          exact open Draft Pull Request
                  ↓
          non-authoritative publication audit
                  ↓
          React read-only publication status
          ```

          The persisted Run must already be `SUCCEEDED`; GitHub publication never creates or upgrades that truth. Multi-task Runs publish only from complete accepted integration evidence covering every task. Single-task fallback requires accepted successful worker evidence whose base matches the persisted Run base. In both cases local Git objects and exact parent provenance are revalidated before any external write.

          The browser cannot author a SHA, ref, branch, base/head commit, local path, PR title/body, or credential. Its POST is body-free and selector-free. The only remote branch namespace is `devflow/run-<run_id>`; same branch/same SHA is idempotent, same branch/different SHA fails closed, and publication never force-pushes, deletes refs, or targets the default branch.

          ### Publication fencing and credential boundary

          `github_publications` is separate from append-closed terminal typed evidence. A publication attempt owns a PostgreSQL DB-time `PUBLISHING` claim with a backend-only random attempt token and bounded expiry. A live concurrent retry fails closed; an expired claim may be taken over with a new token; stale results cannot overwrite the newer audit state. A PUBLISHED audit row cannot be downgraded by a late failure.

          GitHub credentials remain backend-only. REST credentials are sent only to the fixed `https://api.github.com` destination with explicit API version `2026-03-10`; HTTPS Git credentials are injected through child-process Git configuration rather than command arguments. Raw Git stderr and raw GitHub response bodies are not persisted as publication evidence.

          Existing PR reuse requires exact repository, DevFlow head branch, evidence-selected head SHA, persisted base branch, exact PR URL/number identity, `open` state, and `draft=true`. PostgreSQL fencing supplies concurrency control instead of assuming undocumented remote duplicate-create semantics.

          ### Final acceptance snapshot

          The hardened Step 4.7 implementation head `{implementation_head}` passed:

          - PostgreSQL + Redis service startup: **PASS**;
          - Alembic through `0006_github_publications`, downgrade base, and re-upgrade through `0006`: **PASS**;
          - verification Docker image build: **PASS**;
          - Ruff: **PASS**;
          - evidence eligibility / Run-base / real integration-parent provenance regressions: **PASS**;
          - branch namespace / non-force / no-delete / no-default-branch write regressions: **PASS**;
          - publication claim / takeover / stale-token / non-downgrade regressions: **PASS**;
          - selector-free GET + body-free POST regressions: **PASS**;
          - GitHub REST version, credential-destination, exact open-Draft PR identity regressions: **PASS**;
          - backend pytest: **332 passed in 32.79s**;
          - Frontend Quality locked install: **PASS**;
          - TypeScript strict typecheck: **PASS**;
          - frontend lint: **0 warnings / 0 errors**;
          - Vitest: **25 passed across 6 test files**;
          - PUBLISHING retry keeps live/expired claim authority in PostgreSQL: **PASS**;
          - Vite production build: **PASS**;
          - no live GitHub publication mutation or paid SiliconFlow API call was required by CI.

          Frozen Step 4.7 principle:

          > **Accepted runtime/Git evidence selects what may be published; GitHub only receives that already-accepted projection.**

          ---

          ## Gate before Step 4.8 — Benchmark / Demo Suite

          The next roadmap item is **Step 4.8 — Benchmark/demo suite**.

          Step 4.8 may make the accepted runtime reproducibly evaluable and demoable, but it must preserve these boundaries:

          - benchmark inputs, expected outcomes, and grading rules must be versioned and deterministic enough to reproduce reported results;
          - benchmark scoring measures runtime behavior and product quality; it must never become a scheduler, verification, Reviewer, integration, Human Gate, or Run-success authority;
          - benchmark aggregation must distinguish completion, correctness/evidence quality, latency/cost, and failure modes instead of collapsing them into one score that can rewrite runtime truth;
          - fixtures must not contain production credentials, `run_token`, private repository secrets, or unbounded raw model/log data;
          - benchmark/demo Runs must use the same accepted runtime paths and safety gates rather than a privileged shortcut implementation;
          - demo helpers may seed deterministic local/public fixtures but may not bypass Git provenance, persistence, lease/fencing, verification, Reviewer, integration, Metrics, or GitHub publication boundaries;
          - GitHub publication from Step 4.7 remains an external projection only and cannot be used as benchmark ground truth for Run success;
          - reported metrics must identify dataset/fixture version and execution configuration so results are auditable rather than anecdotal.

          **Step 4.8 status: NOT STARTED.**
          '''
          accepted_tail = "\n".join(line[10:] if line.startswith("          ") else line for line in accepted_tail.splitlines()) + "\n"
          progress = progress[:gate] + accepted_tail
          progress_path.write_text(progress, encoding="utf-8")

          publication_path = Path("docs/GITHUB_PUBLICATION.md")
          publication = publication_path.read_text(encoding="utf-8")
          old = "REST authentication is sent only through the Authorization header. HTTPS Git authentication is injected into the child process environment through a temporary Git HTTP extra-header configuration, with terminal credential prompts disabled."
          new = "REST authentication is sent only through the Authorization header, and the credential destination is pinned to `https://api.github.com`; production configuration cannot redirect the Bearer token to another REST host. HTTPS Git authentication is injected into the child process environment through a temporary Git HTTP extra-header configuration, with terminal credential prompts disabled."
          if old not in publication:
              raise SystemExit("missing GitHub publication credential paragraph")
          publication_path.write_text(publication.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit accepted ledger
        run: |
          git config user.name "DevFlow Ledger Bot"
          git config user.email "devflow-ledger@users.noreply.github.com"
          git add docs/GITHUB_PUBLICATION.md docs/STEP_4_7_ACCEPTANCE.md docs/PROGRESS.md
          git commit -m "Step 4.7: accept GitHub publication boundary"
          git push origin HEAD:agent/phase-4-step-4-7-github-publication
