              model_config = ConfigDict(extra="forbid", frozen=True)

              review_round: int = Field(ge=2, le=100)
              previous_decision: ReviewDecision
              repair_attempt_start: int = Field(ge=1, le=100)
              repair_attempt_end: int = Field(ge=1, le=100)
