name: P1.5.6 Semantic Pressure Discovery

on:
  push:
    branches:
      - p156-semantic-pressure-discovery-20260906
    paths:
      - ".github/workflows/p156-semantic-pressure-discovery.yml"

permissions:
  contents: read

jobs:
  preflight:
    name: P1.5.6 Discovery Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          ref: p156-semantic-pressure-discovery-20260906

      - name: Preserve harness scripts
        run: |
          cp scripts/p156_semantic_pressure_discovery.py /tmp/p156_semantic_pressure_discovery.py
          cp scripts/p156_aggregate_semantic_pressure.py /tmp/p156_aggregate_semantic_pressure.py

      - name: Check out frozen production analyzer
        uses: actions/checkout@v6
        with:
          ref: 2ff8d396876f3afd74adaa32fd5a1953687ead36
          clean: true

      - name: Prove frozen source
        run: test "$(git rev-parse HEAD)" = "2ff8d396876f3afd74adaa32fd5a1953687ead36"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install frozen backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Validate harness imports and exact case registry
        env:
          PYTHONPATH: backend
        run: |
          python /tmp/p156_semantic_pressure_discovery.py --list-cases > /tmp/p156-cases.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "py-exception-swallow",
              "api-response-contract",
              "db-transaction-rollback",
              "concurrency-lost-update",
              "security-path-scope",
              "multifile-symbol-rename",
              "deploy-env-default",
              "frontend-stale-submit",
              "cross-file-schema-drift",
              "repair-induced-timeout-regression",
          }
          payload = json.loads(Path('/tmp/p156-cases.json').read_text())
          assert set(payload) == expected, (set(payload), expected)
          assert len(payload) == 10
          print(json.dumps({"case_count": len(payload), "case_ids": sorted(payload)}, indent=2))
          PY

      - name: Run harness Ruff without model calls
        working-directory: backend
        run: ruff check /tmp/p156_semantic_pressure_discovery.py /tmp/p156_aggregate_semantic_pressure.py app/benchmark/semantic_pressure.py

  discovery-case:
    name: P1.5.6 ${{ matrix.case_id }} fresh-review
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case_id:
          - py-exception-swallow
          - api-response-contract
          - db-transaction-rollback
          - concurrency-lost-update
          - security-path-scope
          - multifile-symbol-rename
          - deploy-env-default
          - frontend-stale-submit
          - cross-file-schema-drift
          - repair-induced-timeout-regression

    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.SILICONFLOW_API_KEY }}
      DEVFLOW_SILICONFLOW_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DEVFLOW_REVIEWER_MODEL: qwen3.5-flash
      DEVFLOW_REVIEWER_MAX_OUTPUT_TOKENS: "800"
      DEVFLOW_SILICONFLOW_MAX_RETRIES: "2"

    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          ref: p156-semantic-pressure-discovery-20260906

      - name: Preserve frozen harness
        run: cp scripts/p156_semantic_pressure_discovery.py /tmp/p156_semantic_pressure_discovery.py

      - name: Check out exact frozen source
        uses: actions/checkout@v6
        with:
          ref: 2ff8d396876f3afd74adaa32fd5a1953687ead36
          clean: true

      - name: Prove frozen source
        run: test "$(git rev-parse HEAD)" = "2ff8d396876f3afd74adaa32fd5a1953687ead36"

      - name: Require provider secret
        run: test -n "${DASHSCOPE_API_KEY:-}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frozen backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run fresh-review discovery case
        env:
          PYTHONPATH: backend
        run: >-
          python /tmp/p156_semantic_pressure_discovery.py
          --case-id "${{ matrix.case_id }}"
          --report "p156-${{ matrix.case_id }}.json"

      - name: Upload raw discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p156-${{ matrix.case_id }}
          path: p156-${{ matrix.case_id }}.json
          if-no-files-found: warn

  aggregate:
    name: P1.5.6 Discovery Aggregate
    if: always()
    needs: discovery-case
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          ref: p156-semantic-pressure-discovery-20260906

      - name: Preserve aggregator
        run: cp scripts/p156_aggregate_semantic_pressure.py /tmp/p156_aggregate_semantic_pressure.py

      - name: Check out frozen production analyzer
        uses: actions/checkout@v6
        with:
          ref: 2ff8d396876f3afd74adaa32fd5a1953687ead36
          clean: true

      - name: Prove frozen analyzer
        run: test "$(git rev-parse HEAD)" = "2ff8d396876f3afd74adaa32fd5a1953687ead36"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install frozen analyzer environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Download all raw discovery reports
        uses: actions/download-artifact@v4
        with:
          pattern: p156-*
          path: p156-artifacts
          merge-multiple: true

      - name: Aggregate preregistered semantic-pressure results
        env:
          PYTHONPATH: backend
        run: >-
          python /tmp/p156_aggregate_semantic_pressure.py
          --input-root p156-artifacts
          --output p156-semantic-pressure-summary.json

      - name: Upload discovery aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p156-semantic-pressure-summary
          path: p156-semantic-pressure-summary.json
          if-no-files-found: warn
