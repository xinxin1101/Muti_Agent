name: Frontend Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - ".env.example"
      - ".nvmrc"
      - "frontend/**"
      - "benchmarks/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/frontend-quality.yml"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/windows-portability.yml"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - ".nvmrc"
      - "frontend/**"
      - "benchmarks/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/frontend-quality.yml"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/windows-portability.yml"

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
