name: P1.5.4-E Reviewer Stub Compatibility Fix

# Trigger after workflow registration. Production base remains pinned below.
on:
  push:
    branches: [p154e-teststub-fix-20260905]
    paths: [.github/workflows/p154e-teststub-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: xin_01
          fetch-depth: 0
      - name: Prove base
        run: test "$(git rev-parse HEAD)" = "aaf1c87b4646a5ca02e9e619789c064d51d7e5d1"
      - name: Update reviewer test double signature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_agent_runtime_v3.py')
          text = path.read_text(encoding='utf-8')
          old = '''class _PassingReviewer:\n    async def review(self, task, verification, *, workspace, context_packet=None, trace=None):\n        del task, verification, workspace, context_packet, trace\n'''
          new = '''class _PassingReviewer:\n    async def review(\n        self,\n        task,\n        verification,\n        *,\n        workspace,\n        context_packet=None,\n        closure_context=None,\n        trace=None,\n    ):\n        del task, verification, workspace, context_packet, closure_context, trace\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one _PassingReviewer signature, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Install test environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Run focused regression
        working-directory: backend
        run: |
          ruff check tests/test_agent_runtime_v3.py
          pytest -q tests/test_agent_runtime_v3.py::test_runtime_v3_progressive_import_then_attribute_repair_e2e
      - name: Commit and push production
        run: |
          git config user.name "DevFlow P1.5.4-E"
          git config user.email "actions@users.noreply.github.com"
          git add backend/tests/test_agent_runtime_v3.py
          git commit -m "test(review): update closure-aware reviewer stub"
          git push origin HEAD:xin_01
