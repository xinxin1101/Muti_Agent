name: P1.5.2 Deliverable-Aware Patch

on:
  push:
    branches:
      - agent/p1.5.2-deliverable-aware-convergence
    paths:
      - ".github/workflows/p152-deliverable-aware-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p1.5.2-deliverable-aware-convergence
          fetch-depth: 0

      - name: Clean and audit P1.5.2 runtime
        run: |
          python -m py_compile scripts/p152_cleanup_audit.py
          python scripts/p152_cleanup_audit.py

      - name: Commit cleaned runtime
        run: |
          git config user.name "DevFlow CI Patch"
          git config user.email "devflow-ci@example.com"
          git add backend/app/agent_runtime/loop.py \
                  backend/tests/test_developer_mutation_convergence.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "fix(runtime): clean deliverable convergence trace state"
          git push origin HEAD:agent/p1.5.2-deliverable-aware-convergence
