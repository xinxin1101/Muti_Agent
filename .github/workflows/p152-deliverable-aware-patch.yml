name: P1.5.2 Deliverable-Aware Patch

on:
  push:
    branches:
      - agent/p1.5.2-deliverable-aware-convergence
    paths:
      - ".github/workflows/p152-deliverable-aware-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p1.5.2-deliverable-aware-convergence
          fetch-depth: 0

      - name: Apply P1.5.2 patch
        run: |
          python -m py_compile scripts/p152_patch.py
          python scripts/p152_patch.py

      - name: Commit patched runtime
        run: |
          git config user.name "DevFlow CI Patch"
          git config user.email "devflow-ci@example.com"
          git add backend/app/agent_runtime/loop.py \
                  backend/app/agent_runtime/types.py \
                  backend/app/agents/developer.py \
                  backend/app/models/trace.py \
                  backend/app/trace/collector.py \
                  backend/app/trace/projector.py \
                  backend/tests/test_developer_mutation_convergence.py
          git diff --cached --check
          git commit -m "feat(runtime): converge toward missing deliverables"
          git push origin HEAD:agent/p1.5.2-deliverable-aware-convergence
