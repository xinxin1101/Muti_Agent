name: Backend Quality

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "backend/**"
      - "docs/PRODUCT_PAGES.md"
      - "docs/STEP_4_2_ACCEPTANCE.md"
      - "docs/SSE_LIVE_EVENTS.md"
      - "docs/STEP_4_3_ACCEPTANCE.md"
      - "docs/DAG_VISUALIZATION.md"
      - "docs/STEP_4_4_ACCEPTANCE.md"
      - "docs/PROGRESS.md"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "docs/PRODUCT_PAGES.md"
      - "docs/STEP_4_2_ACCEPTANCE.md"
      - "docs/SSE_LIVE_EVENTS.md"
      - "docs/STEP_4_3_ACCEPTANCE.md"
      - "docs/DAG_VISUALIZATION.md"
      - "docs/STEP_4_4_ACCEPTANCE.md"
      - "docs/PROGRESS.md"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DEVFLOW_DATABASE_URL: postgresql+psycopg://devflow:devflow@localhost:5432/devflow_test
      DEVFLOW_REDIS_URL: redis://localhost:6379/15
      DEVFLOW_DRAMATIQ_NAMESPACE: devflow-ci
      DEVFLOW_DRAMATIQ_QUEUE_NAME: devflow_tasks

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Build verification sandbox image
        run: docker build -f docker/verification.Dockerfile -t devflow-verifier:py311 .

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest
