name: Backend Quality

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - ".env.example"
      - ".python-version"
      - "backend/**"
      - "benchmarks/**"
      - "scripts/**"
      - "compose.dev.yml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/backend-quality.yml"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/windows-portability.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".env.example"
      - ".python-version"
      - "backend/**"
      - "benchmarks/**"
      - "scripts/**"
      - "compose.dev.yml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/backend-quality.yml"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/windows-portability.yml"

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    env:
      DEVFLOW_DATABASE_URL: postgresql+psycopg://devflow:devflow@localhost:5432/devflow_test
      DEVFLOW_REDIS_URL: redis://localhost:6379/15
      DEVFLOW_DRAMATIQ_NAMESPACE: devflow-ci
      DEVFLOW_DRAMATIQ_QUEUE_NAME: devflow_tasks

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked backend environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Validate PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Build verification sandbox image
        run: docker build -f docker/verification.Dockerfile -t devflow-verifier:py311 .

      - name: Run Ruff
        run: ruff check .

      - name: Validate V1 benchmark fixtures
        run: devflow-benchmark validate --suite ../benchmarks/v1/demo-suite.json

      - name: Run deterministic V1 control-plane demos
        run: >-
          devflow-benchmark demo
          --manifest ../benchmarks/v1/control-plane-demo.json
          --repository-root .
          --timeout-seconds 180

      - name: Run deterministic V1.1 chaos recovery benchmark
        run: >-
          devflow-benchmark chaos
          --manifest ../benchmarks/v1_1/chaos-recovery.json
          --repository-root .
          --timeout-seconds 300

      - name: Run pytest
        run: pytest
