name: Backend Quality

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Diagnose Ruff fix
        run: |
          ruff check . --fix
          git diff --exit-code

      - name: Run pytest
        run: pytest
