name: P1.5.3 Real Gomoku A-B

on:
  push:
    branches:
      - p153-gomoku-ab-20260905
    paths:
      - ".github/workflows/p153-real-gomoku-ab.yml"
      - "scripts/p153_real_gomoku_ab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gomoku-ab:
    name: Gomoku ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: P1.5.1
            artifact: p151
            sha: 3db0363264508eb11549a3d116e5b823a2be21bc
          - label: P1.5.2
            artifact: p152
            sha: 3e8fee7ff31187e403f23f0af8764e70f23eb408
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.SILICONFLOW_API_KEY }}
      DEVFLOW_DATABASE_URL: postgresql+psycopg://devflow:devflow@127.0.0.1:5432/devflow_acceptance
      DEVFLOW_REDIS_URL: redis://127.0.0.1:6379/14
      DEVFLOW_WORKSPACE_ROOT: .devflow/p153-gomoku-ab
      DEVFLOW_RUN_TOKEN_BUDGET_TOKENS: "50000"
      DEVFLOW_AGENT_RUNTIME_V3_ENABLED: "true"
      DEVFLOW_DEVELOPER_RUNTIME_V3_ENABLED: "true"
      DEVFLOW_REPAIR_RUNTIME_V3_ENABLED: "true"
      DEVFLOW_RUNTIME_MUTATION_GATE_ENABLED: "true"
      DEVFLOW_RUNTIME_IMPORT_PREFETCH_ENABLED: "true"
      DEVFLOW_RUNTIME_REPO_MAP_ENABLED: "true"
      DEVFLOW_RUNTIME_EVENT_CONDENSER_ENABLED: "true"
      DEVFLOW_RUNTIME_STUCK_DETECTOR_ENABLED: "true"
      DEVFLOW_OPENHANDS_PATCH_ENABLED: "true"
      DEVFLOW_CONTEXT_COMPACTION_ENABLED: "true"
      DEVFLOW_ROLE_CONTEXT_PROJECTION_ENABLED: "true"
      DEVFLOW_ADAPTIVE_PACKAGE_BUDGET_ENABLED: "true"
      DEVFLOW_SILICONFLOW_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DEVFLOW_PLANNER_MODEL: qwen3.5-flash
      DEVFLOW_DEVELOPER_MODEL: qwen3.5-flash
      DEVFLOW_REPAIR_MODEL: qwen3.5-flash
      DEVFLOW_REVIEWER_MODEL: qwen3.5-flash
      DEVFLOW_FAILURE_EXPLANATION_MODEL: qwen3.5-flash
      DEVFLOW_SILICONFLOW_MAX_RETRIES: "2"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Preserve harness outside repository
        shell: bash
        run: cp scripts/p153_real_gomoku_ab.py /tmp/p153_real_gomoku_ab.py

      - name: Check out exact runtime baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          clean: true

      - name: Prove pinned baseline
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "label=${{ matrix.label }}"
          echo "expected=${{ matrix.sha }}"
          echo "actual=${actual}"
          test "${actual}" = "${{ matrix.sha }}"

      - name: Require real provider secret
        shell: bash
        run: |
          if [ -z "${DASHSCOPE_API_KEY:-}" ]; then
            echo "::error::No Qwen/DashScope provider secret is configured."
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Build verification sandbox
        run: docker build -f backend/docker/verification.Dockerfile -t devflow-verifier:py311 backend

      - name: Run pinned real Gomoku UI experiment
        run: >-
          python /tmp/p153_real_gomoku_ab.py
          --label "${{ matrix.label }}"
          --baseline-sha "${{ matrix.sha }}"
          --report "p153-gomoku-${{ matrix.artifact }}.json"

      - name: Upload A-B report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p153-gomoku-${{ matrix.artifact }}
          path: p153-gomoku-${{ matrix.artifact }}.json
          if-no-files-found: warn
