name: P1.5.5 Apply Evaluability Gate

on:
  workflow_dispatch:
  push:
    branches:
      - p155-convergence-validation-20260905
    paths:
      - ".github/workflows/p155-convergence-apply-evaluable.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: p155-convergence-benchmark-20260905
          fetch-depth: 2

      - name: Prove expected feature head
        run: test "$(git rev-parse HEAD)" = "12c5d03f8c2174ab0919d877199233ce12a84890"

      - name: Apply exact evaluability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/benchmark/convergence.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    task_succeeded: bool\n    final_review_passed: bool\n    converged: bool\n''',
                  '''    task_succeeded: bool\n    final_review_passed: bool\n    evaluable: bool\n    converged: bool\n''',
              ),
              (
                  '''    repair_attempts: int = Field(ge=0)\n    primary_recurrence_events: int = Field(ge=0)\n''',
                  '''    repair_attempts: int = Field(ge=0)\n    initial_primary_events: int = Field(ge=0)\n    primary_recurrence_events: int = Field(ge=0)\n''',
              ),
              (
                  '''    baseline_converged: bool\n    closure_converged: bool\n''',
                  '''    baseline_converged: bool\n    closure_converged: bool\n    baseline_evaluable: bool\n    closure_evaluable: bool\n''',
              ),
              (
                  '''class ConvergenceAggregate(BenchmarkModel):\n    sample_count: int = Field(ge=1)\n    baseline_success_rate: float = Field(ge=0.0, le=1.0)\n    closure_success_rate: float = Field(ge=0.0, le=1.0)\n    baseline_confirmed_churn_case_rate: float = Field(ge=0.0, le=1.0)\n    closure_confirmed_churn_case_rate: float = Field(ge=0.0, le=1.0)\n''',
                  '''class ConvergenceAggregate(BenchmarkModel):\n    sample_count: int = Field(ge=1)\n    evaluable_pair_count: int = Field(ge=0)\n    baseline_success_rate: float = Field(ge=0.0, le=1.0)\n    closure_success_rate: float = Field(ge=0.0, le=1.0)\n    baseline_confirmed_churn_case_rate: float | None = Field(\n        default=None, ge=0.0, le=1.0\n    )\n    closure_confirmed_churn_case_rate: float | None = Field(\n        default=None, ge=0.0, le=1.0\n    )\n''',
              ),
              (
                  '''    mean_total_token_delta: float\n    median_total_token_delta: float\n''',
                  '''    mean_total_token_delta: float | None = None\n    median_total_token_delta: float | None = None\n''',
              ),
              (
                  '''    final_pass = bool(run.reviews) and run.reviews[-1].decision is ReviewOutcome.PASS\n\n    return ConvergenceRunMetrics(\n''',
                  '''    final_pass = bool(run.reviews) and run.reviews[-1].decision is ReviewOutcome.PASS\n    initial_primary_events = sum(\n        event.issue_class is ConvergenceIssueClass.INITIAL_PRIMARY for event in events\n    )\n    initial_churn_trap_events = sum(\n        event.issue_class is ConvergenceIssueClass.INITIAL_CHURN_TRAP for event in events\n    )\n    evaluable = initial_primary_events > 0 and initial_churn_trap_events == 0\n\n    return ConvergenceRunMetrics(\n''',
              ),
              (
                  '''        final_review_passed=final_pass,\n        converged=run.task_succeeded and final_pass,\n''',
                  '''        final_review_passed=final_pass,\n        evaluable=evaluable,\n        converged=run.task_succeeded and final_pass,\n''',
              ),
              (
                  '''        repair_attempts=run.repair_attempts,\n        primary_recurrence_events=sum(\n''',
                  '''        repair_attempts=run.repair_attempts,\n        initial_primary_events=initial_primary_events,\n        primary_recurrence_events=sum(\n''',
              ),
              (
                  '''        initial_churn_trap_events=sum(\n            event.issue_class is ConvergenceIssueClass.INITIAL_CHURN_TRAP for event in events\n        ),\n''',
                  '''        initial_churn_trap_events=initial_churn_trap_events,\n''',
              ),
              (
                  '''    if baseline.converged and not closure.converged:\n        verdict = ConvergencePairVerdict.REGRESSED\n''',
                  '''    if not baseline.evaluable or not closure.evaluable:\n        verdict = ConvergencePairVerdict.INCONCLUSIVE\n    elif baseline.converged and not closure.converged:\n        verdict = ConvergencePairVerdict.REGRESSED\n''',
              ),
              (
                  '''        baseline_converged=baseline.converged,\n        closure_converged=closure.converged,\n''',
                  '''        baseline_converged=baseline.converged,\n        closure_converged=closure.converged,\n        baseline_evaluable=baseline.evaluable,\n        closure_evaluable=closure.evaluable,\n''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected convergence source for replacement: {old[:80]!r}")
              text = text.replace(old, new)

          old = '''    deltas = tuple(compare_convergence_pair(baseline, closure) for baseline, closure in pairs)\n    baseline_runs = tuple(item[0] for item in pairs)\n    closure_runs = tuple(item[1] for item in pairs)\n\n    churn_improvements = sum(\n        baseline.has_confirmed_churn and not closure.has_confirmed_churn\n        for baseline, closure in pairs\n    )\n    churn_regressions = sum(\n        not baseline.has_confirmed_churn and closure.has_confirmed_churn\n        for baseline, closure in pairs\n    )\n    cycle_wins = sum(\n        closure.extra_review_repair_cycles < baseline.extra_review_repair_cycles\n        for baseline, closure in pairs\n    )\n    cycle_losses = sum(\n        closure.extra_review_repair_cycles > baseline.extra_review_repair_cycles\n        for baseline, closure in pairs\n    )\n    token_delta_pcts = [\n        delta.total_token_delta_pct\n        for delta in deltas\n        if delta.total_token_delta_pct is not None\n    ]\n\n    sample_count = len(pairs)\n'''
          new = '''    deltas = tuple(compare_convergence_pair(baseline, closure) for baseline, closure in pairs)\n    baseline_runs = tuple(item[0] for item in pairs)\n    closure_runs = tuple(item[1] for item in pairs)\n    evaluable_pairs = tuple(\n        (baseline, closure)\n        for baseline, closure in pairs\n        if baseline.evaluable and closure.evaluable\n    )\n    evaluable_deltas = tuple(\n        delta for delta in deltas if delta.verdict is not ConvergencePairVerdict.INCONCLUSIVE\n    )\n\n    churn_improvements = sum(\n        baseline.has_confirmed_churn and not closure.has_confirmed_churn\n        for baseline, closure in evaluable_pairs\n    )\n    churn_regressions = sum(\n        not baseline.has_confirmed_churn and closure.has_confirmed_churn\n        for baseline, closure in evaluable_pairs\n    )\n    cycle_wins = sum(\n        closure.extra_review_repair_cycles < baseline.extra_review_repair_cycles\n        for baseline, closure in evaluable_pairs\n    )\n    cycle_losses = sum(\n        closure.extra_review_repair_cycles > baseline.extra_review_repair_cycles\n        for baseline, closure in evaluable_pairs\n    )\n    token_delta_pcts = [\n        delta.total_token_delta_pct\n        for delta in evaluable_deltas\n        if delta.total_token_delta_pct is not None\n    ]\n\n    sample_count = len(pairs)\n    evaluable_pair_count = len(evaluable_pairs)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected aggregate prelude source")
          text = text.replace(old, new)

          old = '''        sample_count=sample_count,\n        baseline_success_rate=sum(item.converged for item in baseline_runs) / sample_count,\n        closure_success_rate=sum(item.converged for item in closure_runs) / sample_count,\n        baseline_confirmed_churn_case_rate=(\n            sum(item.has_confirmed_churn for item in baseline_runs) / sample_count\n        ),\n        closure_confirmed_churn_case_rate=(\n            sum(item.has_confirmed_churn for item in closure_runs) / sample_count\n        ),\n'''
          new = '''        sample_count=sample_count,\n        evaluable_pair_count=evaluable_pair_count,\n        baseline_success_rate=sum(item.converged for item in baseline_runs) / sample_count,\n        closure_success_rate=sum(item.converged for item in closure_runs) / sample_count,\n        baseline_confirmed_churn_case_rate=(\n            sum(baseline.has_confirmed_churn for baseline, _ in evaluable_pairs)\n            / evaluable_pair_count\n            if evaluable_pair_count\n            else None\n        ),\n        closure_confirmed_churn_case_rate=(\n            sum(closure.has_confirmed_churn for _, closure in evaluable_pairs)\n            / evaluable_pair_count\n            if evaluable_pair_count\n            else None\n        ),\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected aggregate rate source")
          text = text.replace(old, new)

          old = '''        mean_total_token_delta=mean(delta.total_token_delta for delta in deltas),\n        median_total_token_delta=median(delta.total_token_delta for delta in deltas),\n        mean_total_token_delta_pct=(mean(token_delta_pcts) if token_delta_pcts else None),\n'''
          new = '''        mean_total_token_delta=(\n            mean(delta.total_token_delta for delta in evaluable_deltas)\n            if evaluable_deltas\n            else None\n        ),\n        median_total_token_delta=(\n            median(delta.total_token_delta for delta in evaluable_deltas)\n            if evaluable_deltas\n            else None\n        ),\n        mean_total_token_delta_pct=(mean(token_delta_pcts) if token_delta_pcts else None),\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected aggregate token source")
          path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("backend/tests/test_convergence_benchmark.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''\ndef test_aggregate_rejects_empty_input() -> None:\n'''
          addition = '''\ndef test_pair_is_inconclusive_when_primary_is_not_observed() -> None:\n    baseline = _run(\n        variant="baseline",\n        reviews=(_changes(_issue("canvas sizing concern", line=60)), _pass()),\n        repair_attempts=1,\n        total_tokens=10000,\n    )\n    closure = _run(\n        variant="closure",\n        reviews=(_changes(_issue("canvas sizing concern", line=60)), _pass()),\n        repair_attempts=1,\n        total_tokens=10000,\n    )\n\n    delta = compare_convergence_pair(baseline, closure)\n\n    assert baseline.evaluable is False\n    assert closure.evaluable is False\n    assert delta.verdict is ConvergencePairVerdict.INCONCLUSIVE\n\n\ndef test_pair_is_inconclusive_when_trap_is_already_in_initial_review() -> None:\n    initial = _changes(\n        _issue("duplicate restart button"),\n        _issue("style naming should be cleaned up", line=80),\n    )\n    baseline = _run(\n        variant="baseline",\n        reviews=(initial, _pass()),\n        repair_attempts=1,\n        total_tokens=10000,\n    )\n    closure = _run(\n        variant="closure",\n        reviews=(initial, _pass()),\n        repair_attempts=1,\n        total_tokens=10000,\n    )\n\n    delta = compare_convergence_pair(baseline, closure)\n\n    assert baseline.initial_primary_events == 1\n    assert baseline.initial_churn_trap_events == 1\n    assert baseline.evaluable is False\n    assert delta.verdict is ConvergencePairVerdict.INCONCLUSIVE\n\n\ndef test_aggregate_excludes_inconclusive_pairs_from_churn_statistics() -> None:\n    valid_baseline = _run(\n        variant="baseline-valid",\n        reviews=(\n            _changes(_issue("duplicate restart button")),\n            _changes(_issue("style naming should be cleaned up", line=80)),\n            _pass(),\n        ),\n        repair_attempts=2,\n        total_tokens=10000,\n    )\n    valid_closure = _run(\n        variant="closure-valid",\n        reviews=(_changes(_issue("duplicate restart button")), _pass()),\n        repair_attempts=1,\n        total_tokens=9500,\n    )\n    invalid_baseline = _run(\n        variant="baseline-invalid",\n        reviews=(_changes(_issue("canvas sizing concern", line=60)), _pass()),\n        repair_attempts=1,\n        total_tokens=8000,\n    )\n    invalid_closure = _run(\n        variant="closure-invalid",\n        reviews=(_changes(_issue("canvas sizing concern", line=60)), _pass()),\n        repair_attempts=1,\n        total_tokens=7000,\n    )\n\n    aggregate = aggregate_convergence_pairs(\n        ((valid_baseline, valid_closure), (invalid_baseline, invalid_closure))\n    )\n\n    assert aggregate.sample_count == 2\n    assert aggregate.evaluable_pair_count == 1\n    assert aggregate.baseline_confirmed_churn_case_rate == 1.0\n    assert aggregate.closure_confirmed_churn_case_rate == 0.0\n    assert aggregate.inconclusive_pairs == 1\n    assert aggregate.mean_total_token_delta == -500\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit("unexpected test insertion marker")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Validate evaluability gate
        working-directory: backend
        run: |
          ruff check app/benchmark/__init__.py app/benchmark/convergence.py tests/test_convergence_benchmark.py
          pytest -q tests/test_convergence_benchmark.py

      - name: Commit and push feature branch
        run: |
          git config user.name "DevFlow P1.5.5"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/benchmark/convergence.py backend/tests/test_convergence_benchmark.py
          git diff --cached --check
          git commit -m "fix(benchmark): exclude unevaluable convergence pairs"
          git push origin HEAD:p155-convergence-benchmark-20260905
