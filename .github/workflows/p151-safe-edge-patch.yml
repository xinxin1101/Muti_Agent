name: P1.5.1 Safe Completion Edge Patch

on:
  push:
    branches:
      - agent/p1.5.1-safe-completion-edge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p1.5.1-safe-completion-edge
          fetch-depth: 0

      - name: Apply safe completion-edge guard and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          loop_path = Path('backend/app/agent_runtime/loop.py')
          loop = loop_path.read_text(encoding='utf-8')

          old_before = '''            before_turn_snapshot = workspace.change_snapshot()\n            candidate_changed_files_before_turn = set(\n'''
          new_before = '''            before_turn_snapshot = workspace.change_snapshot()\n            has_workspace_patch_before_turn = (\n                before_turn_snapshot.patch_hash != start_snapshot.patch_hash\n            )\n            candidate_changed_files_before_turn = set(\n'''
          if old_before in loop:
              loop = loop.replace(old_before, new_before, 1)
          elif new_before not in loop:
              raise SystemExit('before-turn patch guard anchor not found')

          old_edge = '''            candidate_completed_this_turn = (\n                candidate_readiness_known\n                and not candidate_ready_before_turn\n                and candidate_ready\n            )\n'''
          new_edge = '''            candidate_completed_this_turn = (\n                candidate_readiness_known\n                and has_workspace_patch_before_turn\n                and not candidate_ready_before_turn\n                and candidate_ready\n            )\n'''
          if old_edge in loop:
              loop = loop.replace(old_edge, new_edge, 1)
          elif new_edge not in loop:
              raise SystemExit('candidate completion edge anchor not found')

          loop_path.write_text(loop, encoding='utf-8')

          test_path = Path('backend/tests/test_developer_mutation_convergence.py')
          tests = test_path.read_text(encoding='utf-8')

          start = tests.find('def test_exact_candidate_hands_off_on_not_ready_to_ready_mutation_edge')
          end = tests.find('\n\ndef test_incomplete_exact_candidate', start)
          if start == -1 or end == -1:
              raise SystemExit('single-file completion-edge test block not found')
          replacement = '''def test_single_exact_candidate_requires_one_observation_before_handoff(\n    tmp_path: Path,\n) -> None:\n    root = _repository(tmp_path)\n    driver = _RecordingDriver(\n        [\n            _response(\n                tool_calls=[\n                    _call(\n                        \"write-ready\",\n                        \"write_file\",\n                        {\"path\": \"src/gomoku_logic.py\", \"content\": \"VALUE = 2\\n\"},\n                    )\n                ]\n            ),\n            _response(\n                tool_calls=[\n                    _call(\n                        \"read-ready\",\n                        \"read_range\",\n                        {\n                            \"path\": \"src/gomoku_logic.py\",\n                            \"start_line\": 1,\n                            \"end_line\": 5,\n                        },\n                    )\n                ]\n            ),\n            _response(content=\"must not be requested\"),\n        ]\n    )\n\n    result = asyncio.run(\n        _developer(driver).run(\n            _task(writable_files=[\"src/gomoku_logic.py\"]),\n            workspace=LocalGitWorkspace(root),\n        )\n    )\n\n    assert result.stop_reason is models.DeveloperStopReason.MODEL_STOP\n    assert len(driver.requests) == 2\n    assert driver.progress_outcomes == [True, False]\n    assert result.changed_files == [\"src/gomoku_logic.py\"]\n    assert \"first observation-only turn\" in result.final_message\n'''
          tests = tests[:start] + replacement + tests[end:]

          failure_start = tests.find('def test_completion_mutation_with_tool_failure_does_not_handoff_early')
          if failure_start == -1:
              raise SystemExit('completion-with-failure test block not found')
          failure_replacement = '''def test_completion_mutation_with_tool_failure_does_not_handoff_early(\n    tmp_path: Path,\n) -> None:\n    root = _repository(tmp_path)\n    driver = _RecordingDriver(\n        [\n            _response(\n                tool_calls=[\n                    _call(\n                        \"write-index\",\n                        \"write_file\",\n                        {\"path\": \"src/index.html\", \"content\": \"<main>board</main>\\n\"},\n                    )\n                ]\n            ),\n            _response(\n                tool_calls=[\n                    _call(\n                        \"write-ui\",\n                        \"write_file\",\n                        {\"path\": \"src/gomoku_ui.js\", \"content\": \"const SIZE = 15;\\n\"},\n                    ),\n                    _call(\n                        \"read-missing\",\n                        \"read_range\",\n                        {\"path\": \"src/missing.py\", \"start_line\": 1, \"end_line\": 5},\n                    ),\n                ]\n            ),\n            _response(\n                tool_calls=[\n                    _call(\n                        \"read-ready\",\n                        \"read_range\",\n                        {\"path\": \"src/gomoku_ui.js\", \"start_line\": 1, \"end_line\": 5},\n                    )\n                ]\n            ),\n            _response(content=\"must not be requested\"),\n        ]\n    )\n\n    result = asyncio.run(\n        _developer(driver).run(\n            _task(writable_files=[\"src/index.html\", \"src/gomoku_ui.js\"]),\n            workspace=LocalGitWorkspace(root),\n        )\n    )\n\n    assert result.stop_reason is models.DeveloperStopReason.MODEL_STOP\n    assert len(driver.requests) == 3\n    assert driver.progress_outcomes == [True, True, False]\n    assert result.changed_files == [\"src/gomoku_ui.js\", \"src/index.html\"]\n    assert \"first observation-only turn\" in result.final_message\n'''
          tests = tests[:failure_start] + failure_replacement + '\n'

          if 'def test_first_turn_that_writes_all_exact_deliverables_does_not_handoff_immediately' not in tests:
              tests += '''\n\ndef test_first_turn_that_writes_all_exact_deliverables_does_not_handoff_immediately(\n    tmp_path: Path,\n) -> None:\n    root = _repository(tmp_path)\n    driver = _RecordingDriver(\n        [\n            _response(\n                tool_calls=[\n                    _call(\n                        \"write-index\",\n                        \"write_file\",\n                        {\"path\": \"src/index.html\", \"content\": \"<main>board</main>\\n\"},\n                    ),\n                    _call(\n                        \"write-ui\",\n                        \"write_file\",\n                        {\"path\": \"src/gomoku_ui.js\", \"content\": \"const SIZE = 15;\\n\"},\n                    ),\n                ]\n            ),\n            _response(\n                tool_calls=[\n                    _call(\n                        \"read-ui\",\n                        \"read_range\",\n                        {\"path\": \"src/gomoku_ui.js\", \"start_line\": 1, \"end_line\": 5},\n                    )\n                ]\n            ),\n            _response(content=\"must not be requested\"),\n        ]\n    )\n\n    result = asyncio.run(\n        _developer(driver).run(\n            _task(writable_files=[\"src/index.html\", \"src/gomoku_ui.js\"]),\n            workspace=LocalGitWorkspace(root),\n        )\n    )\n\n    assert result.stop_reason is models.DeveloperStopReason.MODEL_STOP\n    assert len(driver.requests) == 2\n    assert driver.progress_outcomes == [True, False]\n    assert \"first observation-only turn\" in result.final_message\n'''

          test_path.write_text(tests, encoding='utf-8')
          PY

          git config user.name "DevFlow CI Patch"
          git config user.email "devflow-ci@example.com"
          git add backend/app/agent_runtime/loop.py backend/tests/test_developer_mutation_convergence.py
          git commit -m "fix(runtime): guard mutation-complete handoff"
          git push origin HEAD:agent/p1.5.1-safe-completion-edge
