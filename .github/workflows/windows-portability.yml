name: Windows Portability

on:
  pull_request:
    branches:
      - main
    paths:
      - ".python-version"
      - ".nvmrc"
      - "backend/**"
      - "frontend/**"
      - "scripts/dev.ps1"
      - "compose.dev.yml"
      - "README.md"
      - ".github/workflows/windows-portability.yml"
  push:
    branches:
      - main
    paths:
      - ".python-version"
      - ".nvmrc"
      - "backend/**"
      - "frontend/**"
      - "scripts/dev.ps1"
      - "compose.dev.yml"
      - "README.md"
      - ".github/workflows/windows-portability.yml"

permissions:
  contents: read

jobs:
  windows-portability:
    name: Windows Portability
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run portable backend checks
        working-directory: backend
        run: |
          ruff check app tests
          pytest tests/test_settings.py tests/test_commit_diff_reader.py

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend on Windows
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/dev.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
